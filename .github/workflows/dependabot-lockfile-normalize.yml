name: dependabot-lockfile-normalize

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - package-lock.json

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: dependabot-lockfile-normalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    name: Normalize npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'dependabot/npm_and_yarn/')
      }}

    steps:
      - name: Checkout Dependabot branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify Dependabot branch guard
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
            echo "Refusing to run on non-Dependabot PR."
            exit 1
          fi

          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Refusing to run on fork PR."
            exit 1
          fi

          case "$HEAD_REF" in
            dependabot/npm_and_yarn/*) ;;
            *)
              echo "Refusing to run on non-npm Dependabot branch: $HEAD_REF"
              exit 1
              ;;
          esac

          if [ "$(git rev-parse HEAD)" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Checked out an unexpected commit."
            exit 1
          fi

      - name: Normalize package lock
        run: npx --yes npm@10.9.2 install --package-lock-only --ignore-scripts

      - name: Commit normalized package lock
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already normalized."
            exit 0
          fi

          unexpected_pr_files=""
          while IFS= read -r file; do
            case "$file" in
              package.json|package-lock.json) ;;
              *) unexpected_pr_files="${unexpected_pr_files}${unexpected_pr_files:+$'\n'}${file}" ;;
            esac
          done < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename'
          )

          if [ -n "$unexpected_pr_files" ]; then
            echo "Refusing to approve a Dependabot PR with unexpected files:"
            printf '%s\n' "$unexpected_pr_files"
            exit 1
          fi

          changed_files="$(git diff --name-only)"
          if [ "$changed_files" != "package-lock.json" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$changed_files"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): normalize package lock"
          normalized_sha="$(git rev-parse HEAD)"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" push origin "HEAD:${HEAD_REF}"

          # GITHUB_TOKEN pushes create approval-required pull_request runs.
          # Approve only the expected workflows for this exact normalized SHA.
          for workflow_path in \
            ".github/workflows/build.yml" \
            ".github/workflows/test.yml"
          do
            workflow_run_found=false

            for attempt in $(seq 1 15); do
              workflow_run="$(
                gh api --method GET \
                  "repos/${GITHUB_REPOSITORY}/actions/runs" \
                  -f event=pull_request \
                  -f head_sha="$normalized_sha" \
                  -f per_page=100 \
                  --jq ".workflow_runs[] | select(.path == \"${workflow_path}\") | [.id, .status, (.conclusion // \"\")] | @tsv" \
                  | head -n 1
              )"

              if [ -n "$workflow_run" ]; then
                workflow_run_found=true
                IFS=$'\t' read -r workflow_run_id workflow_run_status workflow_run_conclusion <<< "$workflow_run"

                if [ "$workflow_run_conclusion" = "action_required" ]; then
                  gh api --method POST \
                    "repos/${GITHUB_REPOSITORY}/actions/runs/${workflow_run_id}/approve"
                  echo "Approved ${workflow_path} run ${workflow_run_id}."
                else
                  echo "${workflow_path} run ${workflow_run_id} is ${workflow_run_status}/${workflow_run_conclusion:-pending}."
                fi
                break
              fi

              sleep 2
            done

            if [ "$workflow_run_found" != "true" ]; then
              echo "No ${workflow_path} run appeared for normalized commit ${normalized_sha}."
              exit 1
            fi
          done
